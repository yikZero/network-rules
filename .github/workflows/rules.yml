name: Validate and publish matching data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *' # 04:13 Asia/Singapore
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/install_tools.py --out "$RUNNER_TEMP/bin"
      - run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --log-opts=--all .'
      - run: python3 scripts/check.py
      - run: python3 scripts/build.py --sing-box "$RUNNER_TEMP/bin/sing-box"
  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rules-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/install_tools.py --out "$RUNNER_TEMP/bin"
      - run: python3 scripts/check.py
      - run: python3 scripts/build.py --sing-box "$RUNNER_TEMP/bin/sing-box" --refresh-upstreams
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/publish.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
